basePath: /api/v1
definitions:
  dto.DeriveFromMnemonicFullRequest:
    properties:
      mnemonic:
        example: abandon abandon abandon abandon abandon abandon abandon abandon abandon
          abandon abandon about
        type: string
      passphrase:
        example: ""
        type: string
      path:
        example: m/44'/60'/0'/0/0
        type: string
    required:
    - mnemonic
    type: object
  dto.DeriveFromMnemonicRequest:
    properties:
      mnemonic:
        example: abandon abandon abandon abandon abandon abandon abandon abandon abandon
          abandon abandon about
        type: string
    required:
    - mnemonic
    type: object
  dto.DeriveFromPrivateKeyRequest:
    properties:
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - privateKeyHex
    type: object
  dto.DeriveFromPublicKeyRequest:
    properties:
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - publicKeyHex
    type: object
  dto.EVMAddressResponse:
    properties:
      address:
        example: 0xe364f2f1e5f4f03d1df682322500b9c68c997ec3
        type: string
      addressChecksum:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
      isZero:
        example: false
        type: boolean
    type: object
  dto.EncryptedKeyDTO:
    properties:
      ciphertext:
        example: base64...
        type: string
      nonce:
        example: base64...
        type: string
      salt:
        example: base64...
        type: string
      version:
        example: 1
        type: integer
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: invalid hex format
        type: string
    type: object
  dto.ExportBytesRequest:
    properties:
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - publicKeyHex
    type: object
  dto.GenerateMnemonicRequest:
    properties:
      wordCount:
        enum:
        - 12
        - 15
        - 18
        - 21
        - 24
        example: 12
        type: integer
    required:
    - wordCount
    type: object
  dto.HederaKeyResponse:
    properties:
      hederaKeyString:
        example: 302e020100300506032b6570042204...
        type: string
      keyType:
        example: ECDSA_SECP256K1
        type: string
    type: object
  dto.HederaPrivateKeyRequest:
    properties:
      hederaKeyString:
        example: 302e020100300506032b6570042204...
        type: string
    required:
    - hederaKeyString
    type: object
  dto.HederaPublicKeyRequest:
    properties:
      hederaKeyString:
        example: 302a300506032b6570032100...
        type: string
    required:
    - hederaKeyString
    type: object
  dto.KeyBytesResponse:
    properties:
      compressedBase64:
        example: base64...
        type: string
      compressedHex:
        example: 0x02...
        type: string
      uncompressedBase64:
        example: base64...
        type: string
      uncompressedHex:
        example: 0x04...
        type: string
    type: object
  dto.KeyPairResponse:
    properties:
      evmAddress:
        example: 0xe364f2f1e5f4f03d1df682322500b9c68c997ec3
        type: string
      evmAddressChecksum:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
      peerID:
        example: 16Uiu2HAm3Lkn9NRieuh3UUTWMNthSDumQL9ctTBKxQqdCC79WUSq
        type: string
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
      publicKeyHexUncompressed:
        example: 0x04759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae...
        type: string
    type: object
  dto.KeyTypeResponse:
    properties:
      description:
        example: ECDSA secp256k1 key compatible with Ethereum
        type: string
      isECDSA:
        example: true
        type: boolean
      isEd25519:
        example: false
        type: boolean
      keyType:
        example: ECDSA_SECP256K1
        type: string
    type: object
  dto.MatchPrivateEVMRequest:
    properties:
      evmAddress:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - evmAddress
    - privateKeyHex
    type: object
  dto.MatchPrivatePublicRequest:
    properties:
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - privateKeyHex
    - publicKeyHex
    type: object
  dto.MatchPublicEVMRequest:
    properties:
      evmAddress:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - evmAddress
    - publicKeyHex
    type: object
  dto.MatchPublicPeerIDRequest:
    properties:
      peerID:
        example: 16Uiu2HAm3Lkn9NRieuh3UUTWMNthSDumQL9ctTBKxQqdCC79WUSq
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - peerID
    - publicKeyHex
    type: object
  dto.MatchResponse:
    properties:
      matches:
        example: true
        type: boolean
    type: object
  dto.MnemonicResponse:
    properties:
      mnemonic:
        example: abandon abandon abandon abandon abandon abandon abandon abandon abandon
          abandon abandon about
        type: string
      wordCount:
        example: 12
        type: integer
    type: object
  dto.ParseEVMAddressRequest:
    properties:
      address:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
    required:
    - address
    type: object
  dto.ParsePeerIDRequest:
    properties:
      peerID:
        example: 16Uiu2HAm3Lkn9NRieuh3UUTWMNthSDumQL9ctTBKxQqdCC79WUSq
        type: string
    required:
    - peerID
    type: object
  dto.ParsePrivateKeyRequest:
    properties:
      hex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - hex
    type: object
  dto.ParsePublicKeyRequest:
    properties:
      hex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
    required:
    - hex
    type: object
  dto.ParseSignatureRequest:
    properties:
      signatureHex:
        example: 0x...65bytes...
        type: string
    required:
    - signatureHex
    type: object
  dto.PeerIDResponse:
    properties:
      peerID:
        example: 16Uiu2HAm3Lkn9NRieuh3UUTWMNthSDumQL9ctTBKxQqdCC79WUSq
        type: string
    type: object
  dto.PrivateKeyFromBytesRequest:
    properties:
      bytes:
        example: base64-encoded-32-bytes
        type: string
    required:
    - bytes
    type: object
  dto.PublicKeyFromBytesRequest:
    properties:
      bytes:
        example: base64-encoded-33-or-65-bytes
        type: string
    required:
    - bytes
    type: object
  dto.PublicKeyResponse:
    properties:
      evmAddress:
        example: 0xe364f2f1e5f4f03d1df682322500b9c68c997ec3
        type: string
      evmAddressChecksum:
        example: 0xe364f2f1e5F4F03d1df682322500b9c68C997ec3
        type: string
      peerID:
        example: 16Uiu2HAm3Lkn9NRieuh3UUTWMNthSDumQL9ctTBKxQqdCC79WUSq
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
      publicKeyHexUncompressed:
        example: 0x04759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae...
        type: string
    type: object
  dto.RecoverFromDigestRequest:
    properties:
      digestHex:
        example: 0x1234567890abcdef...32bytes...
        type: string
      signatureHex:
        example: 0x...65bytes...
        type: string
    required:
    - digestHex
    - signatureHex
    type: object
  dto.RecoverPublicKeyRequest:
    properties:
      message:
        example: Hello, World!
        type: string
      signatureHex:
        example: 0x...65bytes...
        type: string
    required:
    - message
    - signatureHex
    type: object
  dto.ScrambleRequest:
    properties:
      password:
        example: mypassword123
        minLength: 8
        type: string
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - password
    - privateKeyHex
    type: object
  dto.ScrambleResponse:
    properties:
      encrypted:
        $ref: '#/definitions/dto.EncryptedKeyDTO'
    type: object
  dto.SignDigestRequest:
    properties:
      digestHex:
        example: 0x1234567890abcdef...32bytes...
        type: string
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - digestHex
    - privateKeyHex
    type: object
  dto.SignMessageRequest:
    properties:
      message:
        example: Hello, World!
        type: string
      privateKeyHex:
        example: 0x1234567890abcdef...
        type: string
    required:
    - message
    - privateKeyHex
    type: object
  dto.SignatureComponentsResponse:
    properties:
      isZero:
        example: false
        type: boolean
      r:
        example: 0x...
        type: string
      s:
        example: 0x...
        type: string
      v:
        example: 0
        type: integer
      vEthereum:
        example: 27
        type: integer
    type: object
  dto.SignatureResponse:
    properties:
      r:
        example: 0x...
        type: string
      s:
        example: 0x...
        type: string
      signatureEthHex:
        example: 0x...65bytes...
        type: string
      signatureHex:
        example: 0x...65bytes...
        type: string
      v:
        example: 0
        type: integer
      vEthereum:
        example: 27
        type: integer
    type: object
  dto.UnscrambleRequest:
    properties:
      encrypted:
        $ref: '#/definitions/dto.EncryptedKeyDTO'
      password:
        example: mypassword123
        type: string
    required:
    - encrypted
    - password
    type: object
  dto.ValidateMnemonicRequest:
    properties:
      mnemonic:
        example: abandon abandon abandon abandon abandon abandon abandon abandon abandon
          abandon abandon about
        type: string
    required:
    - mnemonic
    type: object
  dto.ValidateResponse:
    properties:
      error:
        example: ""
        type: string
      valid:
        example: true
        type: boolean
    type: object
  dto.VerifyDigestRequest:
    properties:
      digestHex:
        example: 0x1234567890abcdef...32bytes...
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
      signatureHex:
        example: 0x...65bytes...
        type: string
    required:
    - digestHex
    - publicKeyHex
    - signatureHex
    type: object
  dto.VerifyMessageRequest:
    properties:
      message:
        example: Hello, World!
        type: string
      publicKeyHex:
        example: 0x02759b048e7ccf6ba68f9658105a4a139b5f9f5dfd451857c600cc28f33a1a99ae
        type: string
      signatureHex:
        example: 0x...65bytes...
        type: string
    required:
    - message
    - publicKeyHex
    - signatureHex
    type: object
  dto.VerifyResponse:
    properties:
      valid:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Interactive API for testing Neuron keylib functionality
  title: Keylib API
  version: "1.0"
paths:
  /bytes/export-public-key:
    post:
      consumes:
      - application/json
      description: Export a public key in multiple formats (compressed/uncompressed,
        base64/hex)
      parameters:
      - description: Public key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ExportBytesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyBytesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Export public key as raw bytes
      tags:
      - bytes
  /bytes/private-key-from-bytes:
    post:
      consumes:
      - application/json
      description: Construct a private key from base64-encoded raw 32-byte value
      parameters:
      - description: Base64-encoded 32 bytes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PrivateKeyFromBytesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Construct private key from raw bytes
      tags:
      - bytes
  /bytes/public-key-from-bytes:
    post:
      consumes:
      - application/json
      description: Construct a public key from base64-encoded raw SEC1 bytes (33 compressed
        or 65 uncompressed)
      parameters:
      - description: Base64-encoded 33 or 65 bytes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PublicKeyFromBytesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Construct public key from raw bytes
      tags:
      - bytes
  /derive/evm-address:
    post:
      consumes:
      - application/json
      description: Derive the Ethereum address from a public key hex string
      parameters:
      - description: Public key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EVMAddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Derive EVM address from public key
      tags:
      - derive
  /derive/evm-address-safe:
    post:
      consumes:
      - application/json
      description: Derive the Ethereum address from a public key with explicit error
        handling for zero keys
      parameters:
      - description: Public key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EVMAddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Derive EVM address with error checking
      tags:
      - derive
  /derive/peer-id:
    post:
      consumes:
      - application/json
      description: Derive the libp2p peer ID from a public key hex string
      parameters:
      - description: Public key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PeerIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Derive libp2p peer ID from public key
      tags:
      - derive
  /derive/public-key:
    post:
      consumes:
      - application/json
      description: Derive the public key from a private key hex string
      parameters:
      - description: Private key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPrivateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Derive public key from private key
      tags:
      - derive
  /encryption/scramble:
    post:
      consumes:
      - application/json
      description: Encrypt a private key using AES-256-GCM with Argon2id key derivation
      parameters:
      - description: Private key and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ScrambleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ScrambleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Encrypt a private key
      tags:
      - encryption
  /encryption/unscramble:
    post:
      consumes:
      - application/json
      description: Decrypt an encrypted private key using the password
      parameters:
      - description: Encrypted key and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UnscrambleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Decrypt a private key
      tags:
      - encryption
  /hedera/detect-key-type:
    post:
      consumes:
      - application/json
      description: Detect if a Hedera private key is Ed25519 or ECDSA secp256k1
      parameters:
      - description: Hedera DER-encoded key string
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.HederaPrivateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Detect Hedera private key type
      tags:
      - hedera
  /hedera/detect-public-key-type:
    post:
      consumes:
      - application/json
      description: Detect if a Hedera public key is Ed25519 or ECDSA secp256k1
      parameters:
      - description: Hedera DER-encoded key string
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.HederaPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Detect Hedera public key type
      tags:
      - hedera
  /hedera/from-private-key:
    post:
      consumes:
      - application/json
      description: Convert a Hedera SDK DER-encoded private key string to Neuron format.
        Rejects Ed25519 keys.
      parameters:
      - description: Hedera DER-encoded key string
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.HederaPrivateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.KeyPairResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Elevate Hedera private key to Neuron format
      tags:
      - hedera
  /hedera/from-public-key:
    post:
      consumes:
      - application/json
      description: Convert a Hedera SDK DER-encoded public key string to Neuron format.
        Rejects Ed25519 keys.
      parameters:
      - description: Hedera DER-encoded key string
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.HederaPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PublicKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Elevate Hedera public key to Neuron format
      tags:
      - hedera
  /hedera/to-private-key:
    post:
      consumes:
      - application/json
      description: Convert a Neuron private key (hex) to Hedera SDK DER-encoded string
        format
      parameters:
      - description: Private key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPrivateKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HederaKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Convert Neuron private key to Hedera format
      tags:
      - hedera
  /hedera/to-public-key:
    post:
      consumes:
      - application/json
      description: Convert a Neuron public key (hex) to Hedera SDK DER-encoded string
        format
      parameters:
      - description: Public key hex
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeriveFromPublicKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HederaKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Convert Neuron public key to Hedera format
      tags:
      - hedera
  /identifiers/evm-checksum:
    post:
      consumes:
      - application/json
      description: Convert an EVM address to its EIP-55 checksummed form
      parameters:
      - description: EVM address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ParseEVMAddressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EVMAddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get EIP-55 checksum address
      tags:
      - identifiers
  /identifiers/parse-evm-address:
    post:
      consumes:
      - application/json
      description: Parse and validate an Ethereum address from hex string
      parameters:
      - description: EVM address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ParseEVMAddressRequest'
      produces:
      - application/json
      responses:
        "200":
